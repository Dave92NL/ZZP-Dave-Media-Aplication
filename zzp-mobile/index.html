<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ZZP Manager Mobile</title>

    <meta name="theme-color" content="#0A0E14" />
    <meta name="description" content="ZZP Manager — dodawanie kosztów i faktur z telefonu" />

    <!-- iOS PWA / Add to Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ZZP Mobile" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />

    <!-- Motyw ustawiany synchronicznie przed pierwszym renderem (brak błysku). Logika = lib/theme.js -->
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('zzp-theme') || 'null');
          var r = document.documentElement;
          if (!t || (t.ui !== 'modern' && t.ui !== 'ledger')) { r.dataset.ui = 'original'; return; }
          var s = t.scheme === 'light' || t.scheme === 'dark' ? t.scheme
            : (window.matchMedia && !matchMedia('(prefers-color-scheme: dark)').matches ? 'light' : 'dark');
          r.dataset.ui = t.ui; r.dataset.scheme = s; r.style.colorScheme = s;
          document.querySelector('meta[name="theme-color"]').setAttribute('content',
            t.ui === 'ledger' ? (s === 'light' ? '#FBF8F1' : '#0C100C') : (s === 'light' ? '#F7F9FC' : '#0B1220'));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div id="net-status" class="net-status hidden"></div>
      <main id="page-content"></main>
      <nav id="bottom-nav" class="bottom-nav"></nav>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
